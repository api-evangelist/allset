name: Allset
description: >-
  Allset is a food pickup and rewards platform (now part of SoundHound AI) that
  lets consumers order ahead from local restaurants and coffee shops for
  grab-and-go, curbside, or dine-in service while earning up to 15% cash back.
  Positioned as an alternative to third-party delivery marketplaces, Allset
  connects diners directly with participating restaurants across 100+ U.S.
  cities, and also runs Allset for Teams for corporate meal ordering. It is a
  consumer mobile application (iOS and Android) with a restaurant partner
  program; it does not publish a public developer API, OpenAPI specification, or
  developer portal.
